<!DOCTYPE html>
<html>
<head>

<title>Predict Engagement</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #dbeafe, #eef5ff);
    margin: 0;
    padding: 0;
}

.form-box{
    width: 55%;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    text-align: center;
}

h1{
    color: #2980b9;
}

p{
    color: #555;
    font-size: 17px;
}

input{
    width: 80%;
    padding: 12px;
    margin: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button{
    background: #3498db;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover{
    background: #2874a6;
}

</style>

</head>

<body>

<div class="form-box">

<h1>Predict Student Engagement</h1>

<p>
Enter the student activity details below to predict the engagement level using the machine learning model.
</p>

<form action="/predict" method="POST">

<input type="number" name="login" placeholder="Login Frequency" required><br>

<input type="number" name="forum" placeholder="Forum Participation" required><br>

<input type="number" name="assignment" placeholder="Assignment Submission" required><br>

<input type="number" name="resource" placeholder="Resource Access Frequency" required><br>

<input type="number" name="quiz" placeholder="Quiz Score" required><br>

<button type="submit">
Predict Engagement
</button>

</form>

<p>
The system analyzes the entered data and predicts whether the student's engagement level is Low, Medium, or High.
</p>

</div>

</body>
</html>
